name: Generate Snake

# Gera a animação da "cobrinha" comendo o grafo de contribuições.
# A saída é publicada na branch `output` e consumida pelo README.
on:
  schedule:
    - cron: "0 6 * * *" # diariamente às 06:00 UTC
  workflow_dispatch: # permite rodar manualmente na aba Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=%2322C55E&color_dots=%230B1220,%230F2A1C,%23156534,%2322C55E,%2306B6D4
            dist/snake-light.svg?palette=github-light&color_snake=%230EA5E9&color_dots=%23EBEDF0,%23BBF7D0,%2386EFAC,%2322C55E,%230891B2

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
