<svg width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid meet" fill="none" role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Brennin — Desenvolvedor Full Stack</title>
  <desc id="desc">Identificação visual com nome, atuação Full Stack e stack principal.</desc>

  <defs>
    <linearGradient id="hairline" x1="260" y1="0" x2="940" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E5E7EB" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#E5E7EB" stop-opacity="0.34"/>
      <stop offset="0.5" stop-color="#E5E7EB" stop-opacity="0.10"/>
      <stop offset="0.78" stop-color="#E5E7EB" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#E5E7EB" stop-opacity="0"/>
    </linearGradient>

    <style>
      text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
        dominant-baseline: alphabetic;
      }

      .stroke { vector-effect: non-scaling-stroke; }
      .decor { stroke: url(#hairline); }
      .label {
        fill: #D6DEE8;
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0.12em;
        paint-order: stroke fill;
        stroke: #050A12;
        stroke-width: 2px;
        stroke-opacity: 0.42;
      }
      .title {
        fill: #F8FAFC;
        font-size: 76px;
        font-weight: 760;
        letter-spacing: -0.04em;
        paint-order: stroke fill;
        stroke: #050A12;
        stroke-width: 3px;
        stroke-opacity: 0.46;
      }
      .subtitle {
        fill: #E2E8F0;
        font-size: 22px;
        font-weight: 430;
        letter-spacing: 0;
        paint-order: stroke fill;
        stroke: #050A12;
        stroke-width: 2px;
        stroke-opacity: 0.38;
      }
      .pill {
        fill: #0B1220;
        fill-opacity: 0.38;
        stroke: #64748B;
        stroke-opacity: 0.42;
      }
      .pill-text {
        fill: #F8FAFC;
        font-size: 14px;
        font-weight: 680;
        letter-spacing: 0;
        paint-order: stroke fill;
        stroke: #050A12;
        stroke-width: 1.4px;
        stroke-opacity: 0.42;
      }
    </style>
  </defs>

  <g aria-hidden="true" opacity="0.9">
    <path d="M256 72.5H476" class="stroke decor"/>
    <path d="M724 72.5H944" class="stroke decor"/>
    <path d="M352 231.5H848" class="stroke decor" opacity="0.55"/>
  </g>

  <text x="600" y="77" text-anchor="middle" class="label">DESENVOLVEDOR FULL STACK</text>
  <text x="600" y="151" text-anchor="middle" class="title">Brennin</text>
  <text x="600" y="193" text-anchor="middle" class="subtitle">Interfaces, APIs e automações.</text>

  <g aria-label="Stack principal">
    <g transform="translate(243 226)">
      <rect x="0.5" y="0.5" width="129" height="37" rx="18.5" class="pill stroke"/>
      <circle cx="28" cy="19" r="5.5" fill="#61DAFB"/>
      <text x="48" y="24" class="pill-text">React</text>
    </g>
    <g transform="translate(389 226)">
      <rect x="0.5" y="0.5" width="129" height="37" rx="18.5" class="pill stroke"/>
      <circle cx="28" cy="19" r="5.5" fill="#3178C6"/>
      <text x="48" y="24" class="pill-text">TypeScript</text>
    </g>
    <g transform="translate(535 226)">
      <rect x="0.5" y="0.5" width="129" height="37" rx="18.5" class="pill stroke"/>
      <circle cx="28" cy="19" r="5.5" fill="#512BD4"/>
      <text x="48" y="24" class="pill-text">.NET</text>
    </g>
    <g transform="translate(681 226)">
      <rect x="0.5" y="0.5" width="129" height="37" rx="18.5" class="pill stroke"/>
      <circle cx="28" cy="19" r="5.5" fill="#3776AB"/>
      <text x="48" y="24" class="pill-text">Python</text>
    </g>
    <g transform="translate(827 226)">
      <rect x="0.5" y="0.5" width="129" height="37" rx="18.5" class="pill stroke"/>
      <circle cx="28" cy="19" r="5.5" fill="#00758F"/>
      <text x="48" y="24" class="pill-text">SQL</text>
    </g>
  </g>
</svg>
