<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Brennin · Desenvolvedor Full Stack</title>
  <desc id="desc">Sobre um fundo verde-escuro, três placas em perspectiva representam uma interface, uma API e um banco de dados.</desc>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#82aa97" opacity=".35"/>
    </pattern>
    <linearGradient id="paper">
      <stop stop-color="#112b24"/>
      <stop offset="1" stop-color="#193d31"/>
    </linearGradient>
    <g id="registration" fill="none" stroke="#85a896" stroke-width="1.5">
      <path d="M-7 0H7M0-7V7"/>
    </g>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#paper)"/>
  <rect x="650" y="18" width="532" height="304" fill="url(#dots)"/>
  <g aria-hidden="true">
    <path d="M56 71H529M56 291H529" stroke="#507063"/>
    <circle cx="61" cy="48" r="5" fill="#d8f477"/>
    <text x="79" y="54" font-family="Consolas, monospace" font-size="19" letter-spacing="1" fill="#d7e3d6">@CarvalhoBrennin</text>
    <text x="50" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="134" letter-spacing="-7" fill="#f6f4df">Brennin</text>
    <text x="57" y="254" font-family="'Segoe UI', Arial, sans-serif" font-size="38" fill="#d4ed8a">Desenvolvedor Full Stack</text>
  </g>

  <g stroke="#779786" fill="none" stroke-dasharray="5 8" opacity=".55">
    <path d="M750 112V248M1093 118V248M953 191V308"/>
  </g>
  <g transform="translate(719 24)" stroke-linejoin="round">
    <!-- Camada de dados, com uma malha de registros. -->
    <g transform="translate(0 121)">
      <path d="m31 88 202 77 141-72v10l-141 72-202-77z" fill="#497764" stroke="#a2c6ac" stroke-width="1.5"/>
      <path d="m233 165 141-72v10l-141 72z" fill="#2c5645"/>
      <g transform="matrix(1 .38 -.94 .48 172 16)">
        <rect width="202" height="150" fill="#8ab79b" stroke="#c8debc" stroke-width="2"/>
        <rect x="15" y="14" width="172" height="122" fill="none" stroke="#325c48" stroke-width="2"/>
        <path d="M15 44h172M15 74h172M15 104h172M50 14v122M117 14v122" fill="none" stroke="#325c48" stroke-width="2"/>
        <path d="M64 119h36m29 0h41" fill="none" stroke="#325c48" stroke-width="5"/>
      </g>
    </g>

    <!-- Camada de API, com terminais ligados por trilhas. -->
    <g transform="translate(0 60)">
      <path d="m31 88 202 77 141-72v10l-141 72-202-77z" fill="#948cae" stroke="#e3d9f4" stroke-width="1.5"/>
      <path d="m233 165 141-72v10l-141 72z" fill="#69627f"/>
      <g transform="matrix(1 .38 -.94 .48 172 16)">
        <rect width="202" height="150" fill="#cdc0e5" stroke="#eadff6" stroke-width="2"/>
        <g fill="none" stroke="#695c80" stroke-width="3">
          <path d="M18 119h34l25-25h35l24 25h48M22 67h50l22 23M135 16v49l-22 22"/>
          <circle cx="18" cy="119" r="5"/><circle cx="184" cy="119" r="5"/>
          <rect x="88" y="80" width="24" height="24" fill="#695c80"/>
        </g>
      </g>
    </g>

    <!-- Camada de interface, desenhada no mesmo plano das demais. -->
    <path d="m31 88 202 77 141-72v10l-141 72-202-77z" fill="#9bb955" stroke="#e1f99b" stroke-width="1.5"/>
    <path d="m233 165 141-72v10l-141 72z" fill="#6b883c"/>
    <g transform="matrix(1 .38 -.94 .48 172 16)">
      <rect width="202" height="150" fill="#d8f477" stroke="#f2ffb7" stroke-width="2"/>
      <rect x="16" y="14" width="170" height="122" rx="4" fill="none" stroke="#364b30" stroke-width="3"/>
